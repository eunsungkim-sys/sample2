name: CI - check web page

# PR이 main을 향해 열리거나 갱신될 때마다 실행
on:
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: index.html must exist and contain a <title>
        run: |
          test -f index.html
          grep -q "<title>" index.html
          echo "OK: index.html looks like a web page"
